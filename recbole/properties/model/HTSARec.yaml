n_layers: 1                     # (int) The number of transformer layers in transformer encoder.
n_heads: 2                      # (int) The number of attention heads for multi-head attention layer.
hidden_size: 64                 # (int) The number of features in the hidden state.
inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
hidden_dropout_prob: 0.5        # (float) The probability of an element to be zeroed.
input_dropout_prob: 0.5         # (float) The probability of an element to be zeroed.
attn_dropout_prob: 0.5            # (float) The probability of an attention score to be zeroed.
hidden_act: 'softplus'          # (str) The activation function in feed-forward layer.
layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability. 
initializer_range: 0.02         # (float) The standard deviation for normal initialization.
loss_type: 'CE'                 # (str) The type of loss function. Range in ['BPR', 'CE'].
base: 1.5                       # (float) The base of the logarithm for time-interval binning; the smaller the base, the finer the bins.
timestamp_list_field: 'timestamp_list'
padding_pos: 'r'                # (str) Padding alignment direction: 'r' for right-aligned, 'l' for left-aligned.
transform: mask_sample_itemseq
mask_seq_args:
  neg_sample_num: 10              # (int) The number of negative samples per masked position.
  sample_method: uni             # (str) Sampling method: 'uni' for uniform; 'topk' for taking the top-k hard negatives from neg_sample_num.
  mask_ratio: 0.2                # (float) The probability of each position being masked.
  ft_ratio: 0.0
# Insertion generator parameters
generator_args:
  n_layers: 1                     # (int) The number of transformer layers in transformer encoder.
  n_heads: 2                      # (int) The number of attention heads for multi-head attention layer.
  inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
  hidden_dropout_prob: 0.5        # (float) The probability of an element to be zeroed.
  input_dropout_prob: 0.5         # (float) The probability of an element to be zeroed.
  attn_dropout_prob: 0.5          # (float) The probability of an attention score to be zeroed.
  hidden_act: 'GELU'              # (str) The activation function in feed-forward layer.
  layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
  loss_type: 'BPR'                # (str) The loss function used by the generator.
  insert_ratio: 0.2               # (float) The ratio of inserted elements relative to the sequence length.
  top_k: 50                       # (int) The number of items with the highest similarity used to compute the Hawkes intensity.
  score_act: 'softplus'             # (str) The activation function for the native (dot-product) scores.
  inspire_act: 'sigmod'
  uniform_thr: 0.1                # (float) Uniformity ratio: the top X fraction of sequences are treated as uniform and skipped for augmentation.

# Parameters shared by the generator and the recommender:
loss_weight: [1,1]              # (list) Weight coefficients for the multi-task loss: [recommendation task, uniformity task].
scale_ratio: 0.1                    # (float) The scaling ratio for the loss function.
# GradNorm
a_value: 1.0                     # (float) The impact strength on the inverse update rate.
b_value: 0.5
norm_step: 1                     # (int) Update every N time steps.
w_lr: 0.025
win_len: 1024                    # (int) Window length for average-pooled GradNorm.
stop_check: False
stop_time_step: 20              # (int) The time step at which to stop.
check_len: 50

# Parameters for testing
uni_method: 'topk'
mutil_loss_form: 'GradNormLossFinalForm'  # (str) The multi-task loss preprocessing class: ['StaticLossForm', 'GradNormLossFinalForm'].
insert_mode: 'rel'                # (str) Insertion mode: 'rel' for relative-ratio insertion, 'abs' for absolute-ratio insertion.

data_augment: 'hawkes_insert'     # (str) The data augmentation operation: ['hawkes_insert', 'ti_insert', 'insert', 'mask', 'reorder', 'crop'].
data_augments:
  crop_ratio: [0.3,0.6]
  mask_ratio: [0.1,0.2]
  reorder_ratio: [0.2,0.4]
  insert_ratio: 0.2
