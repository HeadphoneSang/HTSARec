n_layers: 1                     # (int) The number of transformer layers in transformer encoder.
n_heads: 2                      # (int) The number of attention heads for multi-head attention layer.
hidden_size: 64                 # (int) The number of features in the hidden state.
inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
hidden_dropout_prob: 0.5        # (float) The probability of an element to be zeroed.
input_dropout_prob: 0.5         # (float) The probability of an element to be zeroed.
attn_dropout_prob: 0.5            # (float) The probability of an attention score to be zeroed.
hidden_act: 'softplus'          # (str) The activation function in feed-forward layer.
layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability. 
initializer_range: 0.02         # (float) The standard deviation for normal initialization.
loss_type: 'CE'                 # (str) The type of loss function. Range in ['BPR', 'CE'].
base: 1.5                       # (float) 对时间间隔分桶的对数的底数，底数越小分的越精细
timestamp_list_field: 'timestamp_list'
padding_pos: 'r'                #padding 对齐的方向，r是右对齐，l是左对齐
transform: mask_sample_itemseq
mask_seq_args:
  neg_sample_num: 10              #每个掩码位置的负采样个数
  sample_method: uni             #uni表示均匀，topk表示从neg_sample_num里面取topk个难负采样
  mask_ratio: 0.2                #每个位置被掩码的概率
  ft_ratio: 0.0
#插入生成器参数
generator_args:
  n_layers: 1                     # (int) The number of transformer layers in transformer encoder.
  n_heads: 2                      # (int) The number of attention heads for multi-head attention layer.
  inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
  hidden_dropout_prob: 0.5        # (float) The probability of an element to be zeroed.
  input_dropout_prob: 0.5         # (float) The probability of an element to be zeroed.
  attn_dropout_prob: 0.5          # (float) The probability of an attention score to be zeroed.
  hidden_act: 'GELU'              # (str) The activation function in feed-forward layer.
  layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
  loss_type: 'BPR'                # (str) 生成器对应的损失函数
  insert_ratio: 0.2               # (float) 插入的元素所占序列的比例
  top_k: 50                       # (int) 选择相似度最高的几个元素计算霍克斯强度
  score_act: 'softplus'             # 朴素得分的激活函数
  inspire_act: 'sigmod'
  uniform_thr: 0.1                # 均匀化比例，指前0.X的序列为均匀序列，不进行数据增强

#生成器和推荐器的相关参数:
loss_weight: [1,1]              #多任务损失的权重系数，[推荐任务,均匀任务]
scale_ratio: 0.1                    #损失函数的缩放比例
#GradNorm
a_value: 1.0                     #逆更新速率的影响强度
b_value: 0.5
norm_step: 1                     #几个时间步更新一次
w_lr: 0.025
win_len: 1024                    #平均池化的GradNorm
stop_check: False
stop_time_step: 20              #停止的时间步
check_len: 50

#测试用参数
uni_method: 'topk'
mutil_loss_form: 'GradNormLossFinalForm'  # 多任务损失预处理的处理类['StaticLossForm','GradNormLossFinalForm']
insert_mode: 'rel'                # rel 相对比例拆入 abs绝对 比例插入

data_augment: 'hawkes_insert'     #(str) 数据增强的操作['hawkes_insert','ti_insert','insert','mask','reorder','crop']
data_augments:
  crop_ratio: [0.3,0.6]
  mask_ratio: [0.1,0.2]
  reorder_ratio: [0.2,0.4]
  insert_ratio: 0.2
