n_layers: 1                     # (int) The number of transformer layers in the transformer encoder.
n_heads: 2                      # (int) The number of attention heads for the multi-head attention layer.
hidden_size: 64                 # (int) The number of features in the hidden state.
inner_size: 256                 # (int) The inner hidden size in the feed-forward layer.
hidden_dropout_prob: 0.5        # (float) The probability of an element being zeroed.
input_dropout_prob: 0.5         # (float) The probability of an input element being zeroed.
attn_dropout_prob: 0.5          # (float) The probability of an attention score being zeroed.
hidden_act: 'softplus'          # (str) The activation function used in the feed-forward layer.
layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
initializer_range: 0.02         # (float) The standard deviation for normal initialization.
loss_type: 'CE'                 # (str) The type of loss function. Choices: ['BPR', 'CE'].

base: 1.5                       # (float) The logarithmic base used for time-interval discretization. Smaller values produce finer-grained interval buckets.

timestamp_list_field: 'timestamp_list'

padding_pos: 'r'                # (str) The alignment direction for sequence padding. 'r' means right padding, and 'l' means left padding.

transform: mask_sample_itemseq

mask_seq_args:
  neg_sample_num: 10            # (int) The number of negative samples for each masked position.
  sample_method: uni            # (str) 'uni' indicates uniform sampling, while 'topk' selects hard negatives from the sampled candidates.
  mask_ratio: 0.2               # (float) The probability of each position being masked.
  ft_ratio: 0.0

# Parameters for the insertion generator
generator_args:
  n_layers: 1                   # (int) The number of transformer layers in the transformer encoder.
  n_heads: 2                    # (int) The number of attention heads for the multi-head attention layer.
  inner_size: 256               # (int) The inner hidden size in the feed-forward layer.
  hidden_dropout_prob: 0.5      # (float) The probability of an element being zeroed.
  input_dropout_prob: 0.5       # (float) The probability of an input element being zeroed.
  attn_dropout_prob: 0.5        # (float) The probability of an attention score being zeroed.
  hidden_act: 'GELU'            # (str) The activation function used in the feed-forward layer.
  layer_norm_eps: 1e-12         # (float) A value added to the denominator for numerical stability.
  loss_type: 'BPR'              # (str) The loss function used for the generator.
  insert_ratio: 0.2             # (float) The proportion of inserted items in the sequence.
  top_k: 50                     # (int) The number of top similar items used for Hawkes intensity calculation.
  score_act: 'softplus'         # (str) The activation function for the raw similarity score.
  inspire_act: 'sigmod'
  uniform_thr: 0.1              # (float) The uniformity threshold. The top 0.X most uniform sequences will not be augmented.

# Parameters for the generator and recommender
loss_weight: [1,1]              # (list) Multi-task loss weights: [recommendation task, uniformity task].
scale_ratio: 0.1                # (float) The scaling ratio applied to the loss function.

# GradNorm parameters
a_value: 1.0                    # (float) The strength of the inverse training rate adjustment.
b_value: 0.5
norm_step: 1                    # (int) Update the GradNorm weights every N training steps.
w_lr: 0.025
win_len: 1024                   # (int) Window length used for average pooling in GradNorm.
stop_check: False
stop_time_step: 20              # (int) The training step for stopping the adaptive update.
check_len: 50

# Parameters used for evaluation/testing
uni_method: 'topk'

mutil_loss_form: 'GradNormLossFinalForm'  # (str) The preprocessing strategy for multi-task loss.
                                          # Choices: ['StaticLossForm', 'GradNormLossFinalForm']

insert_mode: 'rel'              # (str) Insertion mode. 'rel' indicates relative-ratio insertion,
                                # while 'abs' indicates absolute-number insertion.

data_augment: 'hawkes_insert'   # (str) Data augmentation strategy.
                                # Choices: ['hawkes_insert', 'ti_insert', 'insert', 'mask', 'reorder', 'crop']

data_augments:
  crop_ratio: [0.3,0.6]
  mask_ratio: [0.1,0.2]
  reorder_ratio: [0.2,0.4]
  insert_ratio: 0.2